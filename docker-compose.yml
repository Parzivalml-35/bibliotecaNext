# MySQL para desarrollo. Las variables salen de .env (copia de .env.example).
name: bibliotecanext

services:
  db:
    image: mysql:8.4
    container_name: biblioteca-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Bogota
    ports:
      # Solo accesible desde este equipo (127.0.0.1), no desde la red.
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Los .sql de db/init/ se ejecutan en orden alfabético SOLO la primera vez (volumen vacío).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
