<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
<!-- Favicon (DI-13): el logo reducido de docs/marca/logo-reducido.svg. Next lo sirve como /icon.svg y agrega el <link>.
     En la pestaña el SVG va como imagen: no ve las variables CSS de la página y currentColor sería negro. Por eso lleva
     el color primary fijo (claro: oklch(0.562 0.142 51) = #b4570c) y, si el navegador está en modo oscuro, el primary
     del tema oscuro (oklch(0.744 0.15 59.6) = #f0923b), que se lee sobre pestañas oscuras. -->
<style>
  path, circle { fill: #b4570c; }
  @media (prefers-color-scheme: dark) { path, circle { fill: #f0923b; } }
</style>
